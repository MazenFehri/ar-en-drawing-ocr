services:
  ocr-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # ponytail: "ocr"/"ocr" is a documented local-dev default, not a real
      # credential. Override POSTGRES_PASSWORD (and this DSN, if the user is
      # changed too) via .env for anything beyond a laptop.
      - DATABASE_URL=postgresql://ocr:${POSTGRES_PASSWORD:-ocr}@db:5432/ocr_db
    volumes:
      # Persist downloaded model weights across rebuilds so the slow first-request
      # download only happens once. Must match the non-root `appuser` home directory
      # baked into the Dockerfile, and the Dockerfile must `mkdir` that path as appuser
      # before this volume's first mount — a named volume mounted where the image has
      # NO directory gets auto-vivified by Docker as root-owned, which breaks every
      # runtime model download permanently (see Dockerfile comment above the mkdir).
      # Where the image *does* have the directory, Docker seeds a fresh volume from it,
      # ownership included, so the baked models and appuser's ownership both survive.
      #
      # Path AND volume name both changed for paddleocr 3.x. The path, because 3.x
      # caches under paddlex's registry (~/.paddlex/official_models), not 2.x's
      # ~/.paddleocr — pointing the volume at the old path means the service
      # re-downloads on every start. The name, because the pre-existing
      # `ocrtask_paddle_models` volume is *not* empty: it holds the 2.x PP-OCRv4
      # weights, and Docker only seeds a volume from the image when the volume is
      # empty. Reusing the name would mount that stale v4 tree over the freshly baked
      # v6 models and shadow them completely. A new name gets seeded correctly.
      #
      # `ocrtask_paddle_models` is now garbage and can be reclaimed with
      # `docker volume rm ocrtask_paddle_models` once nothing references it. Do NOT
      # `docker compose down -v` to clean up — that also drops `pgdata`.
      - paddlex_models:/home/appuser/.paddlex/official_models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ocr
      # Local-dev default; override in .env for any real deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr}
      POSTGRES_DB: ocr_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  paddlex_models:
