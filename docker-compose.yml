services:
  ocr-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # ponytail: "ocr"/"ocr" is a documented local-dev default, not a real
      # credential. Override POSTGRES_PASSWORD (and this DSN, if the user is
      # changed too) via .env for anything beyond a laptop.
      - DATABASE_URL=postgresql://ocr:${POSTGRES_PASSWORD:-ocr}@db:5432/ocr_db
    volumes:
      # Persist downloaded PaddleOCR / PPStructure models across rebuilds so the
      # slow first-request model download only happens once. Must match the
      # non-root `appuser` home directory baked into the Dockerfile.
      - paddle_models:/home/appuser/.paddleocr
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ocr
      # Local-dev default; override in .env for any real deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr}
      POSTGRES_DB: ocr_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  paddle_models:
